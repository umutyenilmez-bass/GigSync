name = "gigsync"
main = "worker.js"
compatibility_date = "2024-09-23"

[vars]
APP_NAME = "GigSync"

# Durable Objects Binding for Realtime Room Sync
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "SyncRoom"

# Migrations to register the Durable Object class
[[migrations]]
tag = "v1"
new_classes = ["SyncRoom"]

[observability]
enabled = true
